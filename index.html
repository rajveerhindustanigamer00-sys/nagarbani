<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- LOGIN PANEL -->
    <div id="login-section" class="center-wrapper">
        <div class="card login-card">
            <h2>💬 Family Chat</h2>
            <p>Enter your name & passcode to join</p>
            <input type="text" id="username-input" placeholder="Your Name (e.g. Papa, Rajveer)">
            <input type="password" id="passcode-input" placeholder="Passcode (Owner or Member)">
            <button onclick="joinChat()">Join Room</button>
        </div>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div id="chat-section" class="chat-app" style="display: none;">
        <header class="chat-navbar">
            <div class="user-info">
                <span class="avatar">👨‍👩‍👧‍👦</span>
                <div>
                    <h3 id="user-display-name">Family Group</h3>
                    <small id="user-role-badge" class="badge">Member</small>
                </div>
            </div>
            <div class="nav-actions">
                <button id="owner-panel-btn" class="btn-owner" onclick="toggleAdminPanel()" style="display: none;">👑 Owner Controls</button>
                <button class="btn-logout" onclick="leaveChat()">Leave</button>
            </div>
        </header>

        <!-- OWNER ADMIN PANEL MODAL -->
        <div id="admin-panel" class="admin-panel" style="display: none;">
            <h3>👑 Owner Dashboard (User Activity & Logs)</h3>
            <div id="admin-user-list" class="user-list">
                <!-- User logs loaded here -->
            </div>
        </div>

        <!-- MESSAGES DISPLAY AREA -->
        <main id="chat-box" class="chat-body">
            <!-- Messages render here -->
        </main>

        <!-- EMOJI QUICK BAR -->
        <div class="emoji-bar">
            <span onclick="addEmoji('❤️')">❤️</span>
            <span onclick="addEmoji('😂')">😂</span>
            <span onclick="addEmoji('👍')">👍</span>
            <span onclick="addEmoji('🙏')">🙏</span>
            <span onclick="addEmoji('🎉')">🎉</span>
            <span onclick="addEmoji('🔥')">🔥</span>
            <span onclick="addEmoji('😊')">😊</span>
        </div>

        <!-- INPUT FOOTER -->
        <footer class="chat-footer">
            <label for="media-input" class="attach-btn" title="Attach Photo/Video">📎</label>
            <input type="file" id="media-input" accept="image/*,video/*" onchange="handleFileSelect()" style="display: none;">
            
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </footer>
        <div id="file-preview-indicator" class="file-indicator" style="display: none;"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
