<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Chatroom</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="main-header">
        <h1>🏡 Family Chatroom</h1>
        <p>A private space for family to connect & chat</p>
    </header>

    <main class="chat-container">
        <!-- JOIN SCREEN -->
        <div id="login-section" class="card">
            <h2>Enter Family Room</h2>
            <p>Enter your name and family passcode to join.</p>
            <input type="text" id="username-input" placeholder="Your Name (e.g. Papa, Rajveer, Didi)">
            <input type="password" id="passcode-input" placeholder="Enter Family Passcode">
            <button onclick="joinChat()">Join Chat</button>
        </div>

        <!-- CHATROOM INTERFACE -->
        <div id="chat-section" class="card" style="display: none;">
            <div class="chat-header">
                <h3>Welcome, <span id="user-display"></span>!</h3>
                <button class="btn-leave" onclick="leaveChat()">Leave Chat</button>
            </div>

            <!-- MESSAGES BOX -->
            <div id="chat-box" class="chat-box">
                <!-- Messages will load here automatically -->
            </div>

            <!-- SEND MESSAGE FORM -->
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Type a family message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>Private Family Chat • Nagarbani Portal</p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
